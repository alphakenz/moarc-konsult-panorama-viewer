<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modern Kitchen · 360 Viewer</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"
    />
    <style>
      :root {
        color-scheme: dark;
        --glass: rgba(12, 16, 18, 0.62);
        --line: rgba(255, 255, 255, 0.22);
        --text-soft: rgba(255, 255, 255, 0.72);
      }

      * { box-sizing: border-box; }

      html,
      body,
      #viewer {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #111;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      button {
        border: 0;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }

      .topbar {
        position: fixed;
        z-index: 10;
        inset: 0 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        padding: 18px 22px;
        background: linear-gradient(180deg, rgba(0, 0, 0, 0.5), transparent);
        pointer-events: none;
      }

      .topbar > * { pointer-events: auto; }

      .identity {
        display: flex;
        align-items: center;
        gap: 12px;
        text-shadow: 0 1px 8px rgba(0, 0, 0, 0.55);
      }

      .identity-mark {
        width: 36px;
        height: 36px;
        display: grid;
        place-items: center;
        border: 1px solid rgba(255, 255, 255, 0.45);
        border-radius: 50%;
        background: rgba(0, 0, 0, 0.28);
        font-weight: 800;
      }

      .identity strong,
      .identity span { display: block; }

      .identity span {
        margin-top: 2px;
        color: var(--text-soft);
        font-size: 0.75rem;
      }

      .top-actions,
      .bottom-actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .pill,
      .round-button {
        border: 1px solid var(--line);
        background: var(--glass);
        box-shadow: 0 6px 22px rgba(0, 0, 0, 0.22);
        backdrop-filter: blur(12px);
        transition: background 160ms ease, transform 160ms ease;
      }

      .pill {
        min-height: 38px;
        padding: 0 14px;
        border-radius: 999px;
        font-size: 0.82rem;
      }

      .round-button {
        width: 46px;
        height: 46px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        font-size: 1.15rem;
      }

      .icon-button {
        position: relative;
        width: 46px;
        height: 46px;
        display: grid;
        place-items: center;
        padding: 0;
        border: 1px solid var(--line);
        border-radius: 50%;
        color: white;
        background: var(--glass);
        box-shadow: 0 6px 22px rgba(0, 0, 0, 0.22);
        backdrop-filter: blur(12px);
        transition: background 160ms ease, transform 160ms ease;
      }

      .icon-button svg {
        width: 20px;
        height: 20px;
        fill: none;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 1.8;
      }

      .icon-button:hover,
      .icon-button:focus-visible,
      .icon-button[aria-pressed="true"] {
        background: rgba(255, 255, 255, 0.2);
        transform: translateY(-1px);
      }

      .icon-button:focus-visible,
      .round-button:focus-visible,
      .pill:focus-visible {
        outline: 2px solid rgba(255, 255, 255, 0.95);
        outline-offset: 3px;
      }

      .icon-button::after {
        content: attr(data-tooltip);
        position: absolute;
        top: calc(100% + 10px);
        right: 0;
        z-index: 40;
        width: max-content;
        max-width: 180px;
        padding: 7px 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        color: white;
        background: rgba(10, 13, 14, 0.92);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        font-size: 0.72rem;
        line-height: 1.2;
        opacity: 0;
        pointer-events: none;
        transform: translateY(-4px);
        transition: opacity 140ms ease, transform 140ms ease;
        visibility: hidden;
      }

      .icon-button:hover::after,
      .icon-button:focus-visible::after {
        opacity: 1;
        transform: translateY(0);
        visibility: visible;
      }

      .pill:hover,
      .round-button:hover {
        background: rgba(255, 255, 255, 0.18);
        transform: translateY(-1px);
      }

      .bottom-bar {
        position: fixed;
        z-index: 10;
        inset: auto 0 0;
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 16px;
        padding: 24px 22px;
        background: linear-gradient(0deg, rgba(0, 0, 0, 0.55), transparent);
        pointer-events: none;
      }

      .bottom-bar > * { pointer-events: auto; }

      .hint {
        color: rgba(255, 255, 255, 0.82);
        font-size: 0.78rem;
        text-shadow: 0 1px 7px rgba(0, 0, 0, 0.75);
      }

      .menu {
        position: fixed;
        z-index: 20;
        top: 72px;
        left: 22px;
        width: min(260px, calc(100vw - 44px));
        padding: 14px;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: rgba(10, 13, 14, 0.82);
        box-shadow: 0 16px 48px rgba(0, 0, 0, 0.35);
        backdrop-filter: blur(18px);
      }

      .menu h2 {
        margin: 0 0 10px;
        font-size: 0.9rem;
      }

      .menu button {
        width: 100%;
        padding: 10px;
        border-radius: 10px;
        color: var(--text-soft);
        background: transparent;
        text-align: left;
      }

      .menu button:hover {
        color: white;
        background: rgba(255, 255, 255, 0.12);
      }

      .toast {
        position: fixed;
        z-index: 30;
        left: 50%;
        bottom: 28px;
        transform: translate(-50%, 20px);
        padding: 10px 14px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--glass);
        opacity: 0;
        pointer-events: none;
        transition: opacity 180ms ease, transform 180ms ease;
      }

      .toast.visible {
        opacity: 1;
        transform: translate(-50%, 0);
      }

      [hidden] { display: none !important; }

      @media (max-width: 640px) {
        .topbar { align-items: flex-start; }
        .identity > div:last-child { display: none; }
        .top-actions { gap: 6px; }
        .bottom-bar { align-items: flex-end; }
        .hint { max-width: 145px; line-height: 1.35; }
      }
    </style>
  </head>
  <body>
    <main id="viewer" aria-label="Interactive kitchen panorama"></main>

    <header class="topbar">
      <div class="identity">
        <div class="identity-mark" aria-hidden="true">M</div>
        <div>
          <strong>Modern Kitchen</strong>
          <span>Moarc Konsult Collection </span>
        </div>
      </div>

      <nav class="top-actions" aria-label="Viewer actions">
        <button class="icon-button" id="roomButton" type="button" aria-label="Room" data-tooltip="Room">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="4" y="4" width="6" height="6" rx="1" />
            <rect x="14" y="4" width="6" height="6" rx="1" />
            <rect x="4" y="14" width="6" height="6" rx="1" />
            <rect x="14" y="14" width="6" height="6" rx="1" />
          </svg>
        </button>
        <button class="icon-button" id="autoButton" type="button" aria-label="Auto rotate" aria-pressed="false" data-tooltip="Auto rotate">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 11a8 8 0 0 0-13.6-5.7L4 7.7" />
            <path d="M4 4v3.7h3.7" />
            <path d="M4 13a8 8 0 0 0 13.6 5.7l2.4-2.4" />
            <path d="M20 20v-3.7h-3.7" />
          </svg>
        </button>
        <button class="icon-button" id="musicButton" type="button" aria-label="Play music" aria-pressed="false" data-tooltip="Play music">
          <svg id="musicPlayIcon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9 18V5l10-2v13" />
            <circle cx="6" cy="18" r="3" />
            <circle cx="16" cy="16" r="3" />
          </svg>
          <svg id="musicPauseIcon" viewBox="0 0 24 24" aria-hidden="true" hidden>
            <rect x="7" y="5" width="3.5" height="14" rx="1" />
            <rect x="13.5" y="5" width="3.5" height="14" rx="1" />
          </svg>
        </button>
        <button class="icon-button" id="vrButton" type="button" aria-label="Fullscreen view" data-tooltip="Fullscreen view">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M8 4H4v4" />
            <path d="M16 4h4v4" />
            <path d="M20 16v4h-4" />
            <path d="M4 16v4h4" />
          </svg>
        </button>
        <button class="icon-button" id="shareButton" type="button" aria-label="Share" data-tooltip="Share">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="18" cy="5" r="2.5" />
            <circle cx="6" cy="12" r="2.5" />
            <circle cx="18" cy="19" r="2.5" />
            <path d="m8.2 10.8 7.6-4.4" />
            <path d="m8.2 13.2 7.6 4.4" />
          </svg>
        </button>
      </nav>
    </header>

    <aside class="menu" id="roomMenu" hidden>
      <h2>Rooms</h2>
      <!-- These directions are calibrated to the current kitchen panorama. -->
      <button type="button" data-yaw="0">Kitchen front</button>
      <button type="button" data-yaw="-90">Dining area</button>
      <button type="button" data-yaw="180">Kitchen rear</button>
      <button type="button" data-yaw="90">Kitchen exit</button>
    </aside>

    <footer class="bottom-bar">
      <div class="hint">Drag to look around · Scroll to zoom</div>
      <div class="bottom-actions" aria-label="Zoom controls">
        <button class="round-button" id="zoomOut" type="button" aria-label="Zoom out">−</button>
        <button class="round-button" id="zoomIn" type="button" aria-label="Zoom in">+</button>
        <button class="round-button" id="fullButton" type="button" aria-label="Toggle fullscreen">⛶</button>
      </div>
    </footer>

    <audio id="ambientAudio" src="ambient-panorama.mp3" loop preload="metadata"></audio>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
    <script>
      let viewer;
      let autoRotating = false;
      const ambientAudio = document.getElementById("ambientAudio");

      function createViewer(imageUrl) {
        if (viewer) viewer.destroy();

        autoRotating = false;
        updateAutoRotateButton();

        viewer = pannellum.viewer("viewer", {
          type: "equirectangular",
          panorama: imageUrl,
          autoLoad: true,
          showControls: false,
          hfov: 100,
          minHfov: 55,
          maxHfov: 120,
          pitch: 0,
          yaw: 0,
          northOffset: 0
        });
      }

      function updateAutoRotateButton() {
        const button = document.getElementById("autoButton");
        if (!button) return;
        const label = autoRotating ? "Stop auto rotate" : "Auto rotate";
        button.setAttribute("aria-label", label);
        button.setAttribute("data-tooltip", label);
        button.setAttribute("aria-pressed", String(autoRotating));
      }

      function updateMusicButton() {
        const button = document.getElementById("musicButton");
        const playing = !ambientAudio.paused;
        const label = playing ? "Pause music" : "Play music";
        button.setAttribute("aria-label", label);
        button.setAttribute("data-tooltip", label);
        button.setAttribute("aria-pressed", String(playing));
        document.getElementById("musicPlayIcon").toggleAttribute("hidden", playing);
        document.getElementById("musicPauseIcon").toggleAttribute("hidden", !playing);
      }

      function showToast(message) {
        const toast = document.getElementById("toast");
        toast.textContent = message;
        toast.classList.add("visible");
        window.clearTimeout(showToast.timer);
        showToast.timer = window.setTimeout(() => toast.classList.remove("visible"), 2200);
      }

      createViewer("kitchen-panorama.png");

      document.getElementById("roomButton").addEventListener("click", () => {
        document.getElementById("roomMenu").toggleAttribute("hidden");
      });

      document.getElementById("autoButton").addEventListener("click", () => {
        autoRotating = !autoRotating;
        if (autoRotating) {
          viewer.startAutoRotate(-2);
          showToast("Auto rotation on");
        } else {
          viewer.stopAutoRotate();
          showToast("Auto rotation off");
        }
        updateAutoRotateButton();
      });

      document.getElementById("musicButton").addEventListener("click", async () => {
        if (ambientAudio.paused) {
          try {
            await ambientAudio.play();
            showToast("Ambient music on");
          } catch {
            showToast("Music could not start");
          }
        } else {
          ambientAudio.pause();
          showToast("Ambient music off");
        }
        updateMusicButton();
      });

      ambientAudio.addEventListener("play", updateMusicButton);
      ambientAudio.addEventListener("pause", updateMusicButton);
      updateMusicButton();

      document.querySelectorAll("[data-yaw]").forEach((button) => {
        button.addEventListener("click", () => {
          viewer.lookAt(0, Number(button.dataset.yaw), 100, 900);
          document.getElementById("roomMenu").setAttribute("hidden", "");
        });
      });

      document.getElementById("vrButton").addEventListener("click", () => {
        viewer.toggleFullscreen();
        showToast("Fullscreen viewer opened");
      });

      document.getElementById("fullButton").addEventListener("click", () => {
        viewer.toggleFullscreen();
      });

      document.getElementById("zoomIn").addEventListener("click", () => {
        viewer.setHfov(Math.max(55, viewer.getHfov() - 10));
      });

      document.getElementById("zoomOut").addEventListener("click", () => {
        viewer.setHfov(Math.min(120, viewer.getHfov() + 10));
      });

      document.getElementById("shareButton").addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(window.location.href);
          showToast("Viewer link copied");
        } catch {
          showToast("Copy the page URL to share this viewer");
        }
      });
    </script>
  </body>
</html>
